name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  R-CMD-check:
    name: R-CMD-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r-version: [release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::testthat, any::digest, any::processx, any::future.apply, any::arrow, any::terra, any::sf, any::uuid

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version
        id: rustc
        shell: bash
        run: echo "version=$(rustc -V | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      - name: Cache local CAS server
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/local_cas_server
            ~/.cargo/bin/local_cas_server.exe
            ~/.cargo/registry
            ~/.cargo/git
          key: xet-client-1.7.0-${{ runner.os }}-${{ steps.rustc.outputs.version }}

      - name: Install local CAS server
        shell: bash
        timeout-minutes: 45
        run: |
          EXE=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; fi
          BIN="$HOME/.cargo/bin/local_cas_server$EXE"
          if [ ! -f "$BIN" ]; then
            cargo install xet-client --version 1.7.0 --features simulation --bin local_cas_server --locked
          fi
          test -f "$BIN"
          if command -v cygpath >/dev/null 2>&1; then BIN="$(cygpath -m "$BIN")"; fi
          echo "RXET_LOCAL_CAS_SERVER=$BIN" >> "$GITHUB_ENV"

      - name: Build package
        shell: bash
        run: R CMD build .

      - name: Check package
        shell: bash
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: R CMD check --no-manual *.tar.gz
