[package]
name = 'rxet'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.70'

[lib]
crate-type = ['rlib', 'staticlib']
name = 'rxet'

[dependencies]
extendr-api = '0.9.0'
hf-xet = { git = "https://github.com/huggingface/xet-core.git" }
lazy_static = '1.4'
uuid = { version = '1.0', features = ['v4'] }
tokio = { version = '1.35', features = ['full', 'rt-multi-thread'] }
byteorder = '1.5'
lru = '0.12'
crossbeam-channel = '0.5'
futures-util = '0.3'

[profile.release]
lto = true
codegen-units = 1
